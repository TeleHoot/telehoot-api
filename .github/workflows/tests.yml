name: Tests
on:
  push:
    branches:
      - main
      - dev
  pull_request:
    branches:
      - main
      - dev
jobs:
  tests:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: --health-cmd pg_isready --health-interval 10s --health-timeout 5s --health-retries 5

    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup

      - name: Start MongoDB and initialize
        run: |
          docker run -d \
            -p 27017:27017 \
            --name mongo \
            -e MONGO_INITDB_ROOT_USERNAME=mongo \
            -e MONGO_INITDB_ROOT_PASSWORD=mongo \
            mongo:8.0.6 --replSet test --bind_ip_all --auth

          echo "Waiting for MongoDB to start..."
          for i in {1..30}; do
            if docker logs mongo 2>&1 | grep -q "Waiting for connections"; then
              echo "MongoDB is up!"
              break
            fi
            sleep 2
          done

          echo "Initializing replica set..."
          docker exec mongo mongosh --eval "
            rs.initiate({_id: 'test', members: [{_id: 0, host: 'localhost:27017'}]});
          "

          docker exec mongo mongosh -u mongo -p mongo --eval "
            db.adminCommand({replSetGetStatus: 1});
          "

      - name: Run tests
        run: uv run pytest -v --durations=0 --cov --cov-report=xml